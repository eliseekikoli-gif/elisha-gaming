name: Build Eli Sha Gaming Bundle & APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.22.2'

    - name: Generate Custom Icons & Build
      run: |
        flutter create --org com.elishagaming --project-name elisha_gaming .
        flutter pub get
        dart run flutter_launcher_icons
        flutter build apk --release
        flutter build appbundle --release

    - name: Upload APK (Direct Install)
      uses: actions/upload-artifact@v4
      with:
        name: EliShaGaming-Release-APK
        path: build/app/outputs/flutter-apk/app-release.apk

    - name: Upload AAB (Play Store)
      uses: actions/upload-artifact@v4
      with:
        name: EliShaGaming-PlayStore-AAB
        path: build/app/outputs/bundle/release/app-release.aab
